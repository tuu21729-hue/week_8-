<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <title> Start Stop Fun</title>
    </head>
    <body>
<input id = "freq" type="range" min ="1" max = "40" step="0.1" value="0.1"><label id = "CutOff_Display">CutOff_Range</label>
<input id = "rate" type="range" min ="0.125" max = "10" step="0.001" value="3"><label id = "Rate_Display">Rate_Range</label>

         <script>


// 1. Initialize the Audio Context
const ctx = new AudioContext();

// 2. Create the main audio source (e.g., a sawtooth wave)
const mainOsc = new OscillatorNode(ctx);
mainOsc.type = 'sawtooth';
mainOsc.frequency.value = 55;

// 3. Create the Low-Pass Filter
const lpFilter = new BiquadFilterNode(ctx);
lpFilter.type = 'lowpass';
lpFilter.frequency = 800; // Base cutoff frequency
lpFilter.Q = 10;           // Add resonance for a more noticeable sweep

// 4. Create the LFO (Low Frequency Oscillator)
const lfo = new OscillatorNode(ctx);
lfo.type = 'sine'; 
//lfo.frequency.value = 1; // Speed of modulation (3 Hz / 3 times per second)

// 5. Create the LFO Gain Node to control modulation depth
const lfoDepth = new GainNode(ctx);
//lfoDepth.gain.value = 8000; // Modulates the cutoff by +/- 500Hz (Sweep range: 300Hz to 1300Hz)

// 6. Connect the modulation graph
lfo.connect(lfoDepth);
lfoDepth.connect(lpFilter.frequency); // Target the filter's frequency parameter

// 7. Connect the main audio signal path
mainOsc.connect(lpFilter);
lpFilter.connect(ctx.destination);

// 8. Start both oscillators
mainOsc.start();
lfo.start();

const slider1 = document.querySelector("#freq");
slider1.addEventListener("input", () => {
    ctx.resume();
    lfoDepth.gain.value = 100 * (Number(slider1.value));
    document.querySelector("#CutOff_Display").textContent = slider1.value;
    });

    const slider2 = document.querySelector("#rate");
slider2.addEventListener("input", () => {
    ctx.resume();
    lfo.frequency.value = (Number(slider2.value));
    document.querySelector("#Rate_Display").textContent = slider2.value;
    });






 </script>
    
    </body>
</html>
