<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Start Stop Fun</title>
  </head>
  <body>
    <button id="Start1">Start1</button>
    <input id="range1" type="range" min="50" max="500" value="200" />
    <input id="cutoff1" type="range" min="100" max="2000" value="500" />

    <button id="Start2">Start2</button>
    <input id="range2" type="range" min="100" max="700" value="300" />
    <input id="cutoff2" type="range" min="200" max="3000" value="1000" />

    <button id="Start3">Start3</button>
    <input id="range3" type="range" min="200" max="1000" value="400" />
    <input id="cutoff3" type="range" min="300" max="4000" value="1500" />

    <script>
      const ctx = new AudioContext();

      const mainOsc1 = ctx.createOscillator();
      const filter1 = ctx.createBiquadFilter();
      const lfo1 = ctx.createOscillator();
      const lfoGain1 = ctx.createGain();
      const adsr1 = ctx.createGain();

      mainOsc1.type = "sawtooth";
      mainOsc1.frequency.value = 200;

      filter1.type = "bandpass";
      filter1.frequency.value = 500;

      lfo1.frequency.value = 2;
      lfoGain1.gain.value = 200;

      adsr1.gain.value = 0;

      mainOsc1.connect(filter1);
      filter1.connect(adsr1);
      adsr1.connect(ctx.destination);

      lfo1.connect(lfoGain1);
      lfoGain1.connect(filter1.frequency);

      mainOsc1.start();
      lfo1.start();

      const adsrSwell1 = function () {
        mainOsc1.frequency.value = Math.random() * 200 + 100;

        ctx.resume();

        let now = ctx.currentTime;

        adsr1.gain.cancelScheduledValues(now);
        adsr1.gain.setValueAtTime(0, now);
        adsr1.gain.linearRampToValueAtTime(0.3, now + 1.5);
        adsr1.gain.exponentialRampToValueAtTime(0.0001, now + 5);
      };

      document.getElementById("Start1").addEventListener("click", adsrSwell1);

      document.getElementById("range1").addEventListener("input", function () {
        lfoGain1.gain.value = this.value;
      });

      document.getElementById("cutoff1").addEventListener("input", function () {
        filter1.frequency.value = this.value;
      });

      const mainOsc2 = ctx.createOscillator();
      const filter2 = ctx.createBiquadFilter();
      const lfo2 = ctx.createOscillator();
      const lfoGain2 = ctx.createGain();
      const adsr2 = ctx.createGain();

      mainOsc2.type = "square";
      mainOsc2.frequency.value = 300;

      filter2.type = "bandpass";
      filter2.frequency.value = 1000;

      lfo2.frequency.value = 4;
      lfoGain2.gain.value = 300;

      adsr2.gain.value = 0;

      mainOsc2.connect(filter2);
      filter2.connect(adsr2);
      adsr2.connect(ctx.destination);

      lfo2.connect(lfoGain2);
      lfoGain2.connect(filter2.frequency);

      mainOsc2.start();
      lfo2.start();

      const adsrSwell2 = function () {
        mainOsc2.frequency.value = Math.random() * 300 + 300;

        ctx.resume();

        let now = ctx.currentTime;

        adsr2.gain.cancelScheduledValues(now);
        adsr2.gain.setValueAtTime(0, now);
        adsr2.gain.linearRampToValueAtTime(0.3, now + 1.5);
        adsr2.gain.exponentialRampToValueAtTime(0.0001, now + 5);
      };

      document.getElementById("Start2").addEventListener("click", adsrSwell2);

      document.getElementById("range2").addEventListener("input", function () {
        lfoGain2.gain.value = this.value;
      });

      document.getElementById("cutoff2").addEventListener("input", function () {
        filter2.frequency.value = this.value;
      });

      const mainOsc3 = ctx.createOscillator();
      const filter3 = ctx.createBiquadFilter();
      const lfo3 = ctx.createOscillator();
      const lfoGain3 = ctx.createGain();
      const adsr3 = ctx.createGain();

      mainOsc3.type = "triangle";
      mainOsc3.frequency.value = 400;

      filter3.type = "bandpass";
      filter3.frequency.value = 1500;

      lfo3.frequency.value = 6;
      lfoGain3.gain.value = 400;

      adsr3.gain.value = 0;

      mainOsc3.connect(filter3);
      filter3.connect(adsr3);
      adsr3.connect(ctx.destination);

      lfo3.connect(lfoGain3);
      lfoGain3.connect(filter3.frequency);

      mainOsc3.start();
      lfo3.start();

      const adsrSwell3 = function () {
        mainOsc3.frequency.value = Math.random() * 400 + 600;

        ctx.resume();

        let now = ctx.currentTime;

        adsr3.gain.cancelScheduledValues(now);
        adsr3.gain.setValueAtTime(0, now);
        adsr3.gain.linearRampToValueAtTime(0.3, now + 1.5);
        adsr3.gain.exponentialRampToValueAtTime(0.0001, now + 5);
      };

      document.getElementById("Start3").addEventListener("click", adsrSwell3);

      document.getElementById("range3").addEventListener("input", function () {
        lfoGain3.gain.value = this.value;
      });

      document.getElementById("cutoff3").addEventListener("input", function () {
        filter3.frequency.value = this.value;
      });
    </script>
  </body>
</html>
