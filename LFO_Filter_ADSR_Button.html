
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <title> Start Stop Fun</title>
</head>
<body>
    <button id = "Start1">Start1</button>
    <input id = "range1" type = "range" min = "100" max = "1000" value = "500">
    <input id = "rate1" type = "range" min = "1" max = "20" value = "4">

    <button id = "Start2">Start2</button>
    <input id = "range2" type = "range" min = "200" max = "2000" value = "800">
    <input id = "rate2" type = "range" min = "1" max = "20" value = "6">

    <button id = "Start3">Start3</button>
    <input id = "range3" type = "range" min = "300" max = "3000" value = "1200">
    <input id = "rate3" type = "range" min = "1" max = "20" value = "8">

<script>

const ctx = new AudioContext();

const adsrSwell = function()
{
    mainOsc.frequency.value = Math.random() * 200 + 100;

    ctx.resume();
    let now = ctx.currentTime;

    adsr.gain.cancelScheduledValues(now);
    adsr.gain.setValueAtTime(0, now);
    adsr.gain.linearRampToValueAtTime(1, now + 1.5);
    adsr.gain.exponentialRampToValueAtTime(0.0001, now + 5);
};

const mainOsc = new OscillatorNode(ctx);
mainOsc.type = 'sawtooth';

const lpFilter = new BiquadFilterNode(ctx);
lpFilter.type = 'bandpass';
lpFilter.frequency.value = 500;
lpFilter.Q.value = 8;

const lfo = new OscillatorNode(ctx);
lfo.type = 'sine';
lfo.frequency.value = 4;

const lfoDepth = new GainNode(ctx);
lfoDepth.gain.value = 300;

lfo.connect(lfoDepth);
lfoDepth.connect(lpFilter.frequency);

const adsr = new GainNode(ctx);
adsr.gain.value = 0;

mainOsc.connect(lpFilter);
lpFilter.connect(adsr);
adsr.connect(ctx.destination);

mainOsc.start();
lfo.start();

const theClickButton = document.querySelector("#Start1");
theClickButton.addEventListener("click", adsrSwell);

const range1 = document.querySelector("#range1");
range1.addEventListener("input", function()
{
    lpFilter.frequency.value = range1.value;
    lfoDepth.gain.value = range1.value / 2;
});

const rate1 = document.querySelector("#rate1");
rate1.addEventListener("input", function()
{
    lfo.frequency.value = rate1.value;
});


// Oscillator 2

const adsrSwell2 = function()
{
    mainOsc2.frequency.value = Math.random() * 300 + 300;

    ctx.resume();
    let now = ctx.currentTime;

    adsr2.gain.cancelScheduledValues(now);
    adsr2.gain.setValueAtTime(0, now);
    adsr2.gain.linearRampToValueAtTime(1, now + 1);
    adsr2.gain.exponentialRampToValueAtTime(0.0001, now + 4);
};

const mainOsc2 = new OscillatorNode(ctx);
mainOsc2.type = 'square';

const lpFilter2 = new BiquadFilterNode(ctx);
lpFilter2.type = 'bandpass';
lpFilter2.frequency.value = 800;
lpFilter2.Q.value = 8;

const lfo2 = new OscillatorNode(ctx);
lfo2.type = 'sine';
lfo2.frequency.value = 6;

const lfoDepth2 = new GainNode(ctx);
lfoDepth2.gain.value = 400;

lfo2.connect(lfoDepth2);
lfoDepth2.connect(lpFilter2.frequency);

const adsr2 = new GainNode(ctx);
adsr2.gain.value = 0;

mainOsc2.connect(lpFilter2);
lpFilter2.connect(adsr2);
adsr2.connect(ctx.destination);

mainOsc2.start();
lfo2.start();

const theClickButton2 = document.querySelector("#Start2");
theClickButton2.addEventListener("click", adsrSwell2);

const range2 = document.querySelector("#range2");
range2.addEventListener("input", function()
{
    lpFilter2.frequency.value = range2.value;
    lfoDepth2.gain.value = range2.value / 2;
});

const rate2 = document.querySelector("#rate2");
rate2.addEventListener("input", function()
{
    lfo2.frequency.value = rate2.value;
});


// Oscillator 3

const adsrSwell3 = function()
{
    mainOsc3.frequency.value = Math.random() * 400 + 600;

    ctx.resume();
    let now = ctx.currentTime;

    adsr3.gain.cancelScheduledValues(now);
    adsr3.gain.setValueAtTime(0, now);
    adsr3.gain.linearRampToValueAtTime(1, now + 2);
    adsr3.gain.exponentialRampToValueAtTime(0.0001, now + 6);
};

const mainOsc3 = new OscillatorNode(ctx);
mainOsc3.type = 'triangle';

const lpFilter3 = new BiquadFilterNode(ctx);
lpFilter3.type = 'bandpass';
lpFilter3.frequency.value = 1200;
lpFilter3.Q.value = 8;

const lfo3 = new OscillatorNode(ctx);
lfo3.type = 'sine';
lfo3.frequency.value = 8;

const lfoDepth3 = new GainNode(ctx);
lfoDepth3.gain.value = 600;

lfo3.connect(lfoDepth3);
lfoDepth3.connect(lpFilter3.frequency);

const adsr3 = new GainNode(ctx);
adsr3.gain.value = 0;

mainOsc3.connect(lpFilter3);
lpFilter3.connect(adsr3);
adsr3.connect(ctx.destination);

mainOsc3.start();
lfo3.start();

const theClickButton3 = document.querySelector("#Start3");
theClickButton3.addEventListener("click", adsrSwell3);

const range3 = document.querySelector("#range3");
range3.addEventListener("input", function()
{
    lpFilter3.frequency.value = range3.value;
    lfoDepth3.gain.value = range3.value / 2;
});

const rate3 = document.querySelector("#rate3");
rate3.addEventListener("input", function()
{
    lfo3.frequency.value = rate3.value;
});

</script>

</body>
</html>
